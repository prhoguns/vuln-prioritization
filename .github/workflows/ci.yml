name: CI
on: [push, pull_request]
permissions:
  contents: read

jobs:
  prioritize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.14", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/build_db.py && python scripts/run.py
      - name: The queue must have P0 findings (KEV hits are expected in the EOL images)
        run: grep -q "^| P0 KEV" results/03_tier_summary.md
