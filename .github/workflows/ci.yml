name: CI
on: [push, pull_request]
jobs:
  prioritize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python scripts/build_db.py && python scripts/run.py
      - name: The queue must have P0 findings (KEV hits are expected in the EOL images)
        run: grep -q "^| P0 KEV" results/03_tier_summary.md
